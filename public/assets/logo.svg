<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Nền hình vuông bo góc -->
  <rect width="200" height="200" rx="48" fill="#111827" />
  
  <!-- Hình lục giác nhỏ bên trong mờ ảo -->
  <polygon points="100,65 130.3,82.5 130.3,117.5 100,135 69.7,117.5 69.7,82.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

  <!-- Hình lục giác lớn bên ngoài -->
  <polygon points="100,45 147.6,72.5 147.6,127.5 100,155 52.4,127.5 52.4,72.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  
  <!-- Các điểm node trên lục giác ngoài -->
  <circle cx="100" cy="45" r="6" fill="#ffffff" />
  <circle cx="147.6" cy="72.5" r="6" fill="#ffffff" />
  <circle cx="147.6" cy="127.5" r="6" fill="#ffffff" />
  <circle cx="100" cy="155" r="6" fill="#ffffff" />
  <circle cx="52.4" cy="127.5" r="6" fill="#ffffff" />
  <circle cx="52.4" cy="72.5" r="6" fill="#ffffff" />
  
  <!-- Dấu tích trắng nổi bật ở giữa (thu nhỏ lại để nằm trọn trong lục giác trong) -->
  <path d="M82 105 L95 118 L122 84" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
